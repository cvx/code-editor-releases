<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Editor</title>
<style>
  :root { color-scheme: light dark; --fg: #1c1c1e; --dim: #6b6b70; --bg: #fbfbfd; --card: #fff; --line: #e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f7; --dim: #98989f; --bg: #131316; --card: #1c1c20; --line: #33333a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8vh 6vw; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 .3rem; }
  .ver { color: var(--dim); margin: 0 0 2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 1.5rem; text-align: center; color: var(--dim); }
</style>
<main>
  <h1>Code Editor</h1>
  <p class="ver">Downloads for macOS</p>
  <div class="card">No build published yet — check back shortly.</div>
</main>
