<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cove — Release notes</title>
<!-- The page moved to release-notes.html. This stub stays because the URL is public: every
     appcast published before 0.14 names it as `fullReleaseNotesLink` (Sparkle's Version History
     button), and an already-shipped build reads whichever feed is live when it checks, so the old
     URL has to answer until those items age out of the feed — and links people already hold never
     expire at all. Hand-written; build-site.py doesn't touch it.

     A meta refresh and nothing else: the notes page carries no anchors, so there is no fragment to
     forward and no reason for a script. publish-site.sh takes the extension off both links on the
     way out, which is why they're written with it here — this file is browsable off disk too. -->
<link rel="canonical" href="https://covecode.app/release-notes">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=release-notes">
<p>Cove's <a href="release-notes">release notes</a> have moved.</p>
</html>
